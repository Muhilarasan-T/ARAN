version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - RISK_LOW_MAX=0.40
      - RISK_MEDIUM_MAX=0.75
      - BLOCK_DURATION_SECONDS=600

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
